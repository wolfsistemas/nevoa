<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="description" content="Névoa Cifras — seu repertório de cifras. Busque, toque e monte suas listas." />
    <title>Névoa Cifras</title>

    <link rel="icon" type="image/png" href="./logo.png">
    <link rel="shortcut icon" type="image/png" href="./logo.png">
    <link rel="apple-touch-icon" href="./logo.png">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Névoa Cifras">
    <meta name="apple-mobile-web-app-title" content="Névoa Cifras">
    <link rel="manifest" href="./manifest.json">
    <script>
      try {
        var t = localStorage.getItem('nevoa_theme') === 'light' ? 'light' : 'dark'
        document.documentElement.setAttribute('data-theme', t)
        var m = document.querySelector('meta[name="theme-color"]')
        if (m) m.setAttribute('content', t === 'light' ? '#f3f4f8' : '#0b0e14')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
